module_name: my_mission
parameters:
- group: My Mission
  definitions:
    MYM_ALT:
      description:
        short: 起飞目标高度
        long: |-
          进入 Offboard 后相对 **home 的地面** 上升多少，单位 m。
          起飞点 = home 的 x/y，目标 z = home 的 z 减去这个值（NED 向上为负）。

          地面起飞这条路和拉绳测试无关（拉绳测试只在"离地后切 Offboard"时进入）。
      type: float
      default: 1.5
      decimal: 2
      min: 0.2
      max: 50.0
      unit: m
    MYM_FWD_DIST:
      description:
        short: 起飞后向前飞的距离
        long: |-
          到了 MYM_ALT 之后，沿"解锁时机头所指的方向"（不是正北）再平飞这么远，
          到点后悬停 MYM_HOVER 秒，然后返航回 home、降落。单位 m。
          **起点是 home**（解锁时设的点），不是"进入 Offboard 时的位置"。
          0 = 不飞：跳过 FORWARD 状态，行为和不启用这个功能时完全一样。
          拉绳测试不走 FORWARD，这个参数那一段不生效。
          方向由航向估计决定（GPS 双天线 / 磁罗盘 / EKF），航向歪多少度就飞歪多少度，
          距离越大偏得越远。第一次试先给小值（1~2 m），MYM_ALT 给高一点。
      type: float
      default: 3.0
      decimal: 2
      min: 0.0
      max: 500.0
      unit: m
    MYM_FWD_DIR:
      description:
        short: 前飞方向相对机头的偏角
        long: |-
          相对"解锁时的机头方向"（也就是 home 的航向）再偏多少度，用来往侧面飞。
          0 = 正前方，+90 = 起飞航向的右侧，-90 = 左侧，180 = 正后方。
          只在 MYM_FWD_DIST > 0 时有意义；拉绳测试时这个参数不生效（不飞中转）。
      type: float
      default: 0.0
      decimal: 1
      min: -180.0
      max: 180.0
      unit: deg
    MYM_FWD_SPD:
      description:
        short: 前飞巡航速度
        long: |-
          FORWARD 段的巡航速度上限，单位 m/s。位置目标不是一下子跳过去，
          而是交给 PX4 的 PositionSmoothing 按这个速度规划（配合 MYM_FWD_ACC
          走"加速-匀速-减速"三段）。
          目前只有 FORWARD 段用它，拉绳测试不进 FORWARD。
          给小：慢、姿态平；给大：快、但倾角也大。
          注意这是**惯性系**速度（对地），顶风时地速等于它、空速会更高。
      type: float
      default: 0.5
      decimal: 2
      min: 0.1
      max: 20.0
      unit: m/s
    MYM_FWD_ACC:
      description:
        short: 前飞加/减速度上限
        long: |-
          加速段和减速段的加速度绝对值上限，单位 m/s^2（爬升段也用）。
          **这是决定姿态变化大小的那个参数**：平飞需要的倾角大约是
          atan(加速度 / 9.81)。
          1.0 -> 约 6 度，2.0 -> 约 12 度，5.0 -> 约 27 度。
          太小则速度爬升很慢（短距离时全程都在加减速，永远到不了 MYM_FWD_SPD）。
          经验值：留 2 倍以上的余量给抗风，比赛/演示场合 1.0 ~ 2.0 最舒服。
          顺带决定刹车距离 v^2/(2a)：1 m/s + 1.0 m/s^2 只要 0.5 m。
      type: float
      default: 1.0
      decimal: 2
      min: 0.1
      max: 8.0
      unit: m/s^2
    MYM_FWD_JERK_MAX:
      description:
        short: 远离低头限幅时的 jerk 上限
        long: |-
          中转段轨迹的加加速度上限，单位 m/s^3。需求俯仰角**离低头限幅还远**时用这个值。

          轨迹里的 jerk 只会取"正这个值、零、负这个值"，所以它直接决定姿态的变化率：
          俯仰角速率约等于 **5.84 x jerk** 度每秒（jerk = 4 -> 约 23 度/秒）。
          从平飞到加速度平台（平台角 = atan(MYM_FWD_ACC / 9.81)）需要
          MYM_FWD_ACC / jerk 秒。

          需求角接近限幅（默认从限幅的 80% 起）时按比例往 MYM_FWD_JERK_MIN 降，
          见那个参数。
      type: float
      default: 4.0
      decimal: 1
      min: 0.1
      max: 50.0
      unit: m/s^3
    MYM_FWD_JERK_MIN:
      description:
        short: 贴着低头限幅时的 jerk
        long: |-
          需求俯仰角逼近低头限幅（min(|MYM_PITCH_MIN|, MPC_TILTMAX_AIR)，默认 15 度）时
          用的 jerk，单位 m/s^3。

          调度是线性的：需求角在限幅的 **80% 以下用 MYM_FWD_JERK_MAX**，
          80% -> 100% 之间按比例插到本参数。作用是把"姿态到限幅、前推力接手"
          这个交接过得柔和一些 —— 姿态和缺额出来的推力都来自同一个加速度需求，
          全速撞到边界会让两者同时阶跃。

          jetk 越小、需求角爬得越慢，所以它决定"需求角能不能穿过限幅"：
          一段航程的峰值加速度约 sqrt(jerk x 峰值速度)，只有它超过
          g x tan(限幅) = 2.63 m/s^2 时，前推力辅助才会真正出力。
          6 m/s 的巡航配上 1.0 只有 2.45 m/s^2 —— 辅助永远不会触发，这不是 bug。
      type: float
      default: 1.0
      decimal: 1
      min: 0.1
      max: 50.0
      unit: m/s^3
    MYM_FWD_TMO:
      description:
        short: FORWARD 段超时
        long: |-
          超过这个时间还没到达目的地（航向估计歪 / 顶风 / EKF 位置漂 /
          MYM_ARRIVE 太小），就不再硬追，直接进入降落流程。
          拉绳测试不进 FORWARD，用不到这个超时。
      type: float
      default: 20.0
      decimal: 1
      min: 3.0
      max: 120.0
      unit: s
    MYM_HOVER:
      description:
        short: 到达目标点后的悬停时间
        long: |-
          到达前方点 / 拉绳段结束之后，保持多久再开始**返航**（不是降落），单位 s。
          拉绳测试也用不到它（那一段用 MYR_TILT_HOLD）。
          另外"既没开绳、MYM_FWD_DIST 也是 0"的情况下，起飞后也是悬停这么久再降落。
      type: float
      default: 5.0
      decimal: 1
      min: 0.0
      max: 600.0
      unit: s
    MYM_LAND_MODE:
      description:
        short: 降落方式
        long: |-
          0 = 纯 Offboard 下降：把 trajectory_setpoint 的 z 以 MYM_DESC_RATE 抬回 0，
              同时把该速率作为 velocity[2] 前馈一起发出去（land detector 判断
              "是否被指令下降"读的就是它，不发就永远判不着地、也就永远上不了锁）。
          1 = 交给 PX4 的 AUTO_LAND：发 MAV_CMD_NAV_LAND，收油门 / flare / 着陆检测 /
              自动上锁全部由 PX4 负责。更稳，推荐。
      type: int32
      values:
        0: Offboard descent
        1: PX4 AUTO_LAND
      default: 1
    MYM_DESC_RATE:
      description:
        short: Offboard 下降速率（仅 MYM_LAND_MODE=0）
        long: |-
          下限被强制抬到 1.1 x LNDMC_Z_VEL_MAX（默认 0.25 -> 0.275 m/s）。
          这个 1.1 不是本模块自己定的，是 PX4 land detector 的判据本身：
          MulticopterLandDetector.cpp:242
              _in_descend = isfinite(setpoint.velocity[2])
                            && (setpoint.velocity[2] >= 1.1f * LNDMC_Z_VEL_MAX)
          紧接着 :248 是 ground_contact &= _in_descend，所以下降指令速度低于
          0.275 m/s 时 ground_contact 恒为假，maybe_landed / landed 永远上不去，
          之后发的 disarm 会被 commander 拒绝。
          本模块只是把这条 PX4 判据提前算一遍，好在参数设错时告警而不是默默降不下去。
          设得比下限小会被抬上去并打一条告警。
          想让着陆更柔和请用 MYM_LAND_MODE=1（PX4 AUTO_LAND，自带 flare）。
      type: float
      default: 0.4
      decimal: 2
      min: 0.1
      max: 3.0
      unit: m/s
    MYM_ARRIVE:
      description:
        short: 到达目标点的判定半径
        long: |-
          位置误差小于这个值、且速度小于 0.3 m/s 时判定"到位"。
          定得太小可能因为稳态误差永远到不了，最后走超时。
      type: float
      default: 0.20
      decimal: 2
      min: 0.05
      max: 2.0
      unit: m
    MYM_TKO_TMO:
      description:
        short: 起飞超时
        long: |-
          超过这个时间还没到达 MYM_ALT 就放弃起飞、直接进入降落流程。
      type: float
      default: 20.0
      decimal: 1
      min: 3.0
      max: 120.0
      unit: s
    MYM_LAND_TMO:
      description:
        short: 降落超时
        long: |-
          MYM_LAND_MODE=1 时，超过这个时间既没上锁也没判着地，就转去尝试上锁。
      type: float
      default: 40.0
      decimal: 1
      min: 5.0
      max: 180.0
      unit: s
    MYM_AUTO_DISARM:
      description:
        short: 降落后自动上锁
        long: |-
          1 = 检测到着地后由本模块发 disarm。MYM_LAND_MODE=1 时 PX4 自己也会按
          COM_DISARM_LAND 上锁，谁先到都算数。
      type: int32
      values:
        0: Disabled
        1: Enabled
      default: 1
    MYM_DISARM_TMO:
      description:
        short: 上锁超时
      type: float
      default: 10.0
      decimal: 1
      min: 1.0
      max: 60.0
      unit: s

    # ===================================================================
    # 拉绳测试 MYR_*
    # ===================================================================
    # **没有开关**：判定条件就是进场方式——
    #
    #   离地之后才切进 Offboard   -> 认定是拉绳测试，直接进 TILT
    #   在地面 arm 再切 Offboard  -> 正常起飞流程（TAKEOFF -> FORWARD/HOVER -> ...）
    #
    # 也就是说：手动（POSCTL）把飞机飞到绳快绷紧的地方，再切 Offboard，就开始拉。
    # 地面起飞那趟永远不会拉。
    #
    # TILT 的动作：目标留在当前位置（水平误差≈0，需求只剩前馈），
    # 沿起飞航向发一条加速度前馈，保持 MYR_TILT_HOLD 秒，然后悬停、返航、降落。
    #
    # 绳本身在仿真里：SDF 的 <rope_length> / <anchor_offset> / <stiffness>，
    # 或者启动时 GZ_TETHER=1 GZ_TETHER_LEN=<m> 覆盖。飞控不建模绳子。
    MYR_PITCH_DOWN:
      description:
        short: 拉绳时的目标低头角（油门为 0 才生效）
        long: |-
          想要的角度，单位度，范围 0 ~ 15（= 默认的 MYM_PITCH_MIN）。
          只在 **MYR_FWD_THR = 0** 时起作用：油门一给，姿态就必然被夹在低头上限上。

          用法就是"角度慢慢加"：先把 MYR_FWD_THR 留 0，只调这个值，看着姿态
          一度一度涨上去；什么时候需要更大的力，再给油门。

          内部换算（和位置环一致）：a = g * tan(这个角度)，没有缺额，推进电机不转。
          对表：5° -> 0.86 m/s²，10° -> 1.73 m/s²，15° -> 2.63 m/s²。
          会被夹到 MPC_TILTMAX_AIR 和 |MYM_PITCH_MIN| 里更严的那个以内。
      type: float
      default: 15.0
      decimal: 1
      min: 0.0
      max: 15.0
      unit: deg
    MYR_TILT_HOLD:
      description:
        short: 拉绳保持多久
        long: |-
          从进 TILT 起算，保持多少秒再退前馈、转悬停，单位 s。
          前馈有**固定的**斜坡（2.5 m/s^2/s，写死在代码里，不是参数）：
          a=2.63 时约 1.05 s 爬上去、1.05 s 退回来，所以"满角度"的时间比这个值
          少约 1 s，而 TILT 总时长比它多约 1 s。
          **和 MYM_HOVER 独立**：MYM_HOVER 管悬停多久，这里管拉多久。
          0 = 一到点就开始退，几乎看不到俯仰。
      type: float
      default: 10.0
      decimal: 1
      min: 0.0
      max: 600.0
      unit: s
    MYR_FWD_THR:
      description:
        short: 低头时的前推力电机油门
        long: |-
          归一化油门（0 ~ 1，和 MYM_FWD_THR_MAX 同一口径）。**一给，姿态就自动
          钉在低头上限上**（min(|MYM_PITCH_MIN|, MPC_TILTMAX_AIR)，默认 15°），
          MYR_PITCH_DOWN 被忽略。0 = 不用推进电机，只靠姿态。

          内部换算（和位置环互为逆运算）：
              a = g * ( tan(上限) + 油门 / MYM_FWD_THR_SC )
          位置环再把 a 反解回需求角、夹在 15°，缺额 tan(需求)-tan(15) 乘
          MYM_FWD_THR_SC 正好等于这个油门。

          对表（上限 15°、SC 0.44、4 kg）：
              0.0 -> a =  2.63 m/s^2, 俯仰 -15°, 推进电机   0%, 前向力 10.5 N
              0.2 -> a =  7.09 m/s^2, 俯仰 -15°, 推进电机  20%, 前向力 28.7 N
              0.5 -> a = 13.80 m/s^2, 俯仰 -15°, 推进电机  50%, 前向力 55.9 N

          ⚠ 必须 **MYM_FWD_THR_EN = 1**：辅助关掉时姿态照样钉在 15°，
          但油门那部分力没人出，飞机会被绳拽回去。
          ⚠ MYM_PITCH_MIN 必须 < 0，设成 0 等于关闭夹紧，这里无从反解。
      type: float
      default: 0.0
      decimal: 2
      min: 0.0
      max: 1.0
      unit: norm
