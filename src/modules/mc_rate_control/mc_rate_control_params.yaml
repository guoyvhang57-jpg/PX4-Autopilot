module_name: mc_rate_control
parameters:
- group: Multicopter Rate Control
  definitions:
    MC_ROLLRATE_P:
      description:
        short: Roll rate P gain
        long: Roll rate proportional gain, i.e. control output for angular speed error
          1 rad/s.
      type: float
      default: 0.15
      min: 0.01
      max: 0.5
      decimal: 3
      increment: 0.01
    MC_ROLLRATE_I:
      description:
        short: Roll rate I gain
        long: Roll rate integral gain. Can be set to compensate static thrust difference
          or gravity center offset.
      type: float
      default: 0.2
      min: 0.0
      decimal: 3
      increment: 0.01
    MC_RR_INT_LIM:
      description:
        short: Roll rate integrator limit
        long: Roll rate integrator limit. Can be set to increase the amount of integrator
          available to counteract disturbances or reduced to improve settling time
          after large roll moment trim changes.
      type: float
      default: 0.3
      min: 0.0
      decimal: 2
      increment: 0.01
    MC_ROLLRATE_D:
      description:
        short: Roll rate D gain
        long: Roll rate differential gain. Small values help reduce fast oscillations.
          If value is too big oscillations will appear again.
      type: float
      default: 0.003
      min: 0.0
      max: 0.01
      decimal: 4
      increment: 0.0005
    MC_ROLLRATE_FF:
      description:
        short: Roll rate feedforward
        long: Improves tracking performance.
      type: float
      default: 0.0
      min: 0.0
      decimal: 4
    MC_ROLLRATE_K:
      description:
        short: Roll rate controller gain
        long: |-
          Global gain of the controller.

          This gain scales the P, I and D terms of the controller:
          ```
          output = MC_ROLLRATE_K * (MC_ROLLRATE_P * error
          + MC_ROLLRATE_I * error_integral
          + MC_ROLLRATE_D * error_derivative)
          ```
          Set MC_ROLLRATE_P=1 to implement a PID in the ideal form.
          Set MC_ROLLRATE_K=1 to implement a PID in the parallel form.
      type: float
      default: 1.0
      min: 0.01
      max: 5.0
      decimal: 4
      increment: 0.0005
    MC_PITCHRATE_P:
      description:
        short: Pitch rate P gain
        long: Pitch rate proportional gain, i.e. control output for angular speed
          error 1 rad/s.
      type: float
      default: 0.15
      min: 0.01
      max: 0.6
      decimal: 3
      increment: 0.01
    MC_PITCHRATE_I:
      description:
        short: Pitch rate I gain
        long: Pitch rate integral gain. Can be set to compensate static thrust difference
          or gravity center offset.
      type: float
      default: 0.2
      min: 0.0
      decimal: 3
      increment: 0.01
    MC_PR_INT_LIM:
      description:
        short: Pitch rate integrator limit
        long: Pitch rate integrator limit. Can be set to increase the amount of integrator
          available to counteract disturbances or reduced to improve settling time
          after large pitch moment trim changes.
      type: float
      default: 0.3
      min: 0.0
      decimal: 2
      increment: 0.01
    MC_PITCHRATE_D:
      description:
        short: Pitch rate D gain
        long: Pitch rate differential gain. Small values help reduce fast oscillations.
          If value is too big oscillations will appear again.
      type: float
      default: 0.003
      min: 0.0
      decimal: 4
      increment: 0.0005
    MC_PITCHRATE_FF:
      description:
        short: Pitch rate feedforward
        long: Improves tracking performance.
      type: float
      default: 0.0
      min: 0.0
      decimal: 4
    MC_PITCHRATE_K:
      description:
        short: Pitch rate controller gain
        long: |-
          Global gain of the controller.

          This gain scales the P, I and D terms of the controller:
          ```
          output = MC_PITCHRATE_K * (MC_PITCHRATE_P * error
          + MC_PITCHRATE_I * error_integral
          + MC_PITCHRATE_D * error_derivative)
          ```
          Set MC_PITCHRATE_P=1 to implement a PID in the ideal form.
          Set MC_PITCHRATE_K=1 to implement a PID in the parallel form.
      type: float
      default: 1.0
      min: 0.01
      max: 5.0
      decimal: 4
      increment: 0.0005
    MC_YAWRATE_P:
      description:
        short: Yaw rate P gain
        long: Yaw rate proportional gain, i.e. control output for angular speed error
          1 rad/s.
      type: float
      default: 0.2
      min: 0.0
      max: 0.6
      decimal: 3
      increment: 0.01
    MC_YAWRATE_I:
      description:
        short: Yaw rate I gain
        long: Yaw rate integral gain. Can be set to compensate static thrust difference
          or gravity center offset.
      type: float
      default: 0.1
      min: 0.0
      decimal: 3
      increment: 0.01
    MC_YR_INT_LIM:
      description:
        short: Yaw rate integrator limit
        long: Yaw rate integrator limit. Can be set to increase the amount of integrator
          available to counteract disturbances or reduced to improve settling time
          after large yaw moment trim changes.
      type: float
      default: 0.3
      min: 0.0
      decimal: 2
      increment: 0.01
    MC_YAWRATE_D:
      description:
        short: Yaw rate D gain
        long: Yaw rate differential gain. Small values help reduce fast oscillations.
          If value is too big oscillations will appear again.
      type: float
      default: 0.0
      min: 0.0
      decimal: 4
      increment: 0.0005
    MC_YAWRATE_FF:
      description:
        short: Yaw rate feedforward
        long: Improves tracking performance.
      type: float
      default: 0.0
      min: 0.0
      decimal: 4
    MC_YAWRATE_K:
      description:
        short: Yaw rate controller gain
        long: |-
          Global gain of the controller.

          This gain scales the P, I and D terms of the controller:
          ```
          output = MC_YAWRATE_K * (MC_YAWRATE_P * error
          + MC_YAWRATE_I * error_integral
          + MC_YAWRATE_D * error_derivative)
          ```
          Set MC_YAWRATE_P=1 to implement a PID in the ideal form.
          Set MC_YAWRATE_K=1 to implement a PID in the parallel form.
      type: float
      default: 1.0
      min: 0.01
      max: 5.0
      decimal: 4
      increment: 0.0005
    MC_BAT_SCALE_EN:
      description:
        short: Battery power level scaler
        long: |-
          This compensates for voltage drop of the battery over time by attempting to
          normalize performance across the operating range of the battery. The copter
          should constantly behave as if it was fully charged with reduced max acceleration
          at lower battery percentages. i.e. if hover is at 0.5 throttle at 100% battery,
          it will still be 0.5 at 60% battery.
      type: boolean
      default: 0
    MC_YAW_TQ_CUTOFF:
      description:
        short: Low pass filter cutoff frequency for yaw torque setpoint
        long: |-
          Reduces vibrations by lowering high frequency torque caused by rotor acceleration.
          0 disables the filter
      type: float
      default: 2.0
      min: 0
      max: 10
      unit: Hz
      decimal: 3
    MC_YAW_DIFF_GAIN:
      description:
        short: Yaw differential per unit of yaw integrator
        long: |-
          Routes the yaw integrator to a symmetric thruster pair instead of the lift rotors. Set to
          0 to disable; the yaw loop is then entirely on the lift rotors, as without this feature.

          The pair is driven differentially through actuator_motors_trim, because the allocator is
          deliberately kept blind to its yaw lever arm (CA_ROTORn_PY = 0) and therefore cannot reach
          the differential through any torque setpoint. Exactly the amount handed over is subtracted
          from the torque sent to the allocator, so the two paths always sum to the demand: when the
          pair has no headroom (thrusters off or saturated) everything stays on the lift rotors, and
          the transition is continuous with throttle rather than a switch.

          A unit conversion, not a tuning gain, and **constant with throttle** -- both sides are
          normalised, so it is dimensionless:

            gain = (1 / scale_yaw) / (2 * PY * AX * CT)

          scale_yaw is the allocator's yaw normalisation (the largest entry of the pseudo-inverse's
          yaw column), PY the REAL lever arm, AX the thrust-axis body-x component and CT the rotor
          thrust coefficient. For this airframe:

            10.26 N*m / (2 * 0.55 m * 0.94 * 40 N) = 0.248

          Throttle does not enter the gain, only the limit: the pair sits at u_mean and can move
          min(u_mean, 1-u_mean) either way, so the torque handed over is clamped to that headroom
          divided by the gain.

          PY is the real geometry, NOT CA_ROTORn_PY. That parameter must stay 0, and it is the whole
          reason this path exists: telling the allocator about the lever arm would let it take the
          yaw channel over (the pair is several times more yaw-effective per unit command than a
          lift rotor) and smear the slipstream, so instead the allocator is kept blind and the yaw
          demand comes through the motor trim, which bypasses the allocation.

          Consequence: this gain is the only place the real lever arm is written down. Changing the
          geometry, the number of lift rotors or their thrust-axis tilt changes scale_yaw and the
          gain; CA_ROTORn_PY is not going to remind you.

          Do not set CA_ROTORn_PY non-zero while this is enabled. The allocator and this path would
          then both drive the differential and the yaw loop gain would be wrong.
      type: float
      default: 0.0
      min: 0.0
      max: 1.0
      decimal: 4
      increment: 0.001
    MC_YAW_DIFF_ACT1:
      description:
        short: Actuator index driven up by the yaw differential
        long: |-
          One of the two actuators of the symmetric thruster pair. Only used when MC_YAW_DIFF_GAIN is
          non-zero, and only in Offboard, matching the forward-thrust assist it exists to complement.
      type: int32
      default: 4
      min: 0
      max: 11
    MC_YAW_DIFF_ACT2:
      description:
        short: Actuator index driven down by the yaw differential
        long: |-
          The other actuator of the pair. Must differ from MC_YAW_DIFF_ACT1; the two are driven by
          equal and opposite amounts so the collective thrust is unaffected.
      type: int32
      default: 5
      min: 0
      max: 11
