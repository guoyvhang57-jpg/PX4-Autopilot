module_name: my_mission
parameters:
- group: My Mission
  definitions:
    MYM_ALT:
      description:
        short: 起飞目标高度
        long: |-
          进入 Offboard 后相对"进入点"（通常是地面）上升多少，单位 m。
          目标位置 = 进入时的位置，z 再减去这个值（NED 向上为负）。

          ⚠ 开了系绳测试（MYR_ROPE_LEN > 0）时，这个高度**必须明显小于绳长**：
          飞机在锚点正上方时，斜距就等于这个值，一旦超过绳长，绳会在爬升途中
          绷紧把飞机拽住，表现为"爬不到 MYM_ALT、MYM_TKO_TMO 超时转降落"。
          经验：绳长至少给这个值的 3 倍（MYM_ALT=2 时绳长 ≥ 6 m，推荐 10 m）。
      type: float
      default: 1.5
      decimal: 2
      min: 0.2
      max: 50.0
      unit: m
    MYM_FWD_DIST:
      description:
        short: 起飞后向前飞的距离
        long: |-
          到了 MYM_ALT 之后，沿"起飞那一刻锁定的机头方向"（不是正北）再平飞这么远，
          到点后悬停 MYM_HOVER 秒再降落。单位 m。
          0 = 不飞：跳过 FORWARD 状态，行为和不启用这个功能时完全一样。
          **开了系绳测试（MYR_ROPE_LEN > 0）时这个参数失效** —— 目的地被
          绷紧点接管，绳优先。
          方向由航向估计决定（GPS 双天线 / 磁罗盘 / EKF），航向歪多少度就飞歪多少度，
          距离越大偏得越远。第一次试先给小值（1~2 m），MYM_ALT 给高一点。
      type: float
      default: 3.0
      decimal: 2
      min: 0.0
      max: 500.0
      unit: m
    MYM_FWD_DIR:
      description:
        short: 前飞方向相对机头的偏角
        long: |-
          相对"起飞时的机头方向"再偏多少度，用来往侧面飞。
          0 = 正前方，+90 = 起飞航向的右侧，-90 = 左侧，180 = 正后方。
          只在 MYM_FWD_DIST > 0 时有意义；开了系绳测试时也失效（目的地是绷紧点）。
      type: float
      default: 0.0
      decimal: 1
      min: -180.0
      max: 180.0
      unit: deg
    MYM_FWD_SPD:
      description:
        short: 前飞巡航速度
        long: |-
          FORWARD 段的巡航速度上限，单位 m/s。位置目标不是一下子跳过去，
          而是交给 PX4 的 PositionSmoothing 按这个速度规划（配合 MYM_FWD_ACC
          走"加速-匀速-减速"三段）。
          飞绷紧点时也用这个值 —— 那一段是爬升 + 前飞一起走的。
          给小：慢、姿态平；给大：快、但倾角也大。
          注意这是**惯性系**速度（对地），顶风时地速等于它、空速会更高。
      type: float
      default: 0.5
      decimal: 2
      min: 0.1
      max: 20.0
      unit: m/s
    MYM_FWD_ACC:
      description:
        short: 前飞加/减速度上限
        long: |-
          加速段和减速段的加速度绝对值上限，单位 m/s^2（爬升段也用）。
          **这是决定姿态变化大小的那个参数**：平飞需要的倾角大约是
          atan(加速度 / 9.81)。
          1.0 -> 约 6 度，2.0 -> 约 12 度，5.0 -> 约 27 度。
          太小则速度爬升很慢（短距离时全程都在加减速，永远到不了 MYM_FWD_SPD）。
          经验值：留 2 倍以上的余量给抗风，比赛/演示场合 1.0 ~ 2.0 最舒服。
          顺带决定刹车距离 v^2/(2a)：1 m/s + 1.0 m/s^2 只要 0.5 m。
      type: float
      default: 1.0
      decimal: 2
      min: 0.1
      max: 8.0
      unit: m/s^2
    MYM_FWD_TMO:
      description:
        short: FORWARD 段超时
        long: |-
          超过这个时间还没到达目的地（航向估计歪 / 顶风 / EKF 位置漂 /
          MYM_ARRIVE 太小），就不再硬追，直接进入降落流程。
          **飞绷紧点时也用这个超时**，而那一段比前飞长得多（水平 L*cosθ +
          竖直 L*sinθ），所以开绳时必须放大：10 m 绳实测约 11 s，给 60；
          30 m 绳约 30 s，给 90 以上。
      type: float
      default: 20.0
      decimal: 1
      min: 3.0
      max: 120.0
      unit: s
    MYM_HOVER:
      description:
        short: 到达目标点后的悬停时间
        long: |-
          到达**前方点**后保持多久再开始降落，单位 s。
          只在"没有开绳"的路上用到（开了绳到的是绷紧点，那一段用 MYR_TILT_HOLD）。
          另外"既没开绳、MYM_FWD_DIST 也是 0"的情况下，起飞后也是悬停这么久再降落。
      type: float
      default: 5.0
      decimal: 1
      min: 0.0
      max: 600.0
      unit: s
    MYM_LAND_MODE:
      description:
        short: 降落方式
        long: |-
          0 = 纯 Offboard 下降：把 trajectory_setpoint 的 z 以 MYM_DESC_RATE 抬回 0，
              同时把该速率作为 velocity[2] 前馈一起发出去（land detector 判断
              "是否被指令下降"读的就是它，不发就永远判不着地、也就永远上不了锁）。
          1 = 交给 PX4 的 AUTO_LAND：发 MAV_CMD_NAV_LAND，收油门 / flare / 着陆检测 /
              自动上锁全部由 PX4 负责。更稳，推荐。
      type: int32
      values:
        0: Offboard descent
        1: PX4 AUTO_LAND
      default: 1
    MYM_DESC_RATE:
      description:
        short: Offboard 下降速率（仅 MYM_LAND_MODE=0）
        long: |-
          下限被强制抬到 1.1 x LNDMC_Z_VEL_MAX（默认 0.25 -> 0.275 m/s）。
          这个 1.1 不是本模块自己定的，是 PX4 land detector 的判据本身：
          MulticopterLandDetector.cpp:242
              _in_descend = isfinite(setpoint.velocity[2])
                            && (setpoint.velocity[2] >= 1.1f * LNDMC_Z_VEL_MAX)
          紧接着 :248 是 ground_contact &= _in_descend，所以下降指令速度低于
          0.275 m/s 时 ground_contact 恒为假，maybe_landed / landed 永远上不去，
          之后发的 disarm 会被 commander 拒绝。
          本模块只是把这条 PX4 判据提前算一遍，好在参数设错时告警而不是默默降不下去。
          设得比下限小会被抬上去并打一条告警。
          想让着陆更柔和请用 MYM_LAND_MODE=1（PX4 AUTO_LAND，自带 flare）。
      type: float
      default: 0.4
      decimal: 2
      min: 0.1
      max: 3.0
      unit: m/s
    MYM_ARRIVE:
      description:
        short: 到达目标点的判定半径
        long: |-
          位置误差小于这个值、且速度小于 0.3 m/s 时判定"到位"。
          定得太小可能因为稳态误差永远到不了，最后走超时。
      type: float
      default: 0.20
      decimal: 2
      min: 0.05
      max: 2.0
      unit: m
    MYM_TKO_TMO:
      description:
        short: 起飞超时
        long: |-
          超过这个时间还没到达 MYM_ALT 就放弃起飞、直接进入降落流程。
      type: float
      default: 20.0
      decimal: 1
      min: 3.0
      max: 120.0
      unit: s
    MYM_LAND_TMO:
      description:
        short: 降落超时
        long: |-
          MYM_LAND_MODE=1 时，超过这个时间既没上锁也没判着地，就转去尝试上锁。
      type: float
      default: 40.0
      decimal: 1
      min: 5.0
      max: 180.0
      unit: s
    MYM_AUTO_DISARM:
      description:
        short: 降落后自动上锁
        long: |-
          1 = 检测到着地后由本模块发 disarm。MYM_LAND_MODE=1 时 PX4 自己也会按
          COM_DISARM_LAND 上锁，谁先到都算数。
      type: int32
      values:
        0: Disabled
        1: Enabled
      default: 1
    MYM_DISARM_TMO:
      description:
        short: 上锁超时
      type: float
      default: 10.0
      decimal: 1
      min: 1.0
      max: 60.0
      unit: s

    # ===================================================================
    # 系绳（拉绳）测试 MYR_*
    # ===================================================================
    # 参数全名是 MYR_ 开头（My Rope）。整段的几何只由这 6 个参数决定：
    #
    #   锚点   = EKF 本地原点 + 机体系(MYR_ANCHOR_X, Y, Z)   （地面上的系绳桩）
    #            ↑ 原点是"拿到第一个位置估计"的那个点：仿真里 = 模型出生点，
    #              真机 = 上电时飞机所在的位置。**不是起飞点** —— 锚点在地面上
    #              是固定的，用起飞点会让它随落点漂走（落一次地再解锁就错位）。
    #   绷紧点 = 锚点沿起飞航向水平 L*cos(θ)，再往上 L*sin(θ)
    #            L = MYR_ROPE_LEN，θ = MYR_ROPE_ANGLE
    #   到绷紧点后低头 MYR_PITCH_DOWN 度，高度不变
    #
    # 绷紧点就是"绳子刚好拉直、但还没产生拉力"的位置：斜距正好 = L，
    # 绳和地面的夹角正好 = θ。再往前一点绳才开始出力。
    #
    # ⚠ 绳子的物理实体在仿真里由 gz 的 TetherPlugin 提供，**两边必须填同一个数**：
    #     export GZ_TETHER=1
    #     export GZ_TETHER_LEN=<和 MYR_ROPE_LEN 相同的值>
    #   或者直接改 model.sdf 里 <rope_length>。飞控这侧只负责把飞机飞到几何上
    #   该在的位置，它并不知道绳到底绷没绷 —— 两边不一致就会出现"飞过头被拽回来"
    #   或者"绳一直松着"。
    MYR_ANCHOR_X:
      description:
        short: 系绳锚点的前后位置（机体系，前为正）
        long: |-
          地面系绳点相对 **EKF 本地原点**的前后偏移，单位 m，沿起飞那一刻的机头方向。
          和 MYR_ANCHOR_Y / MYR_ANCHOR_Z 一起构成"地面机体坐标系"（只含航向、
          不含倾斜；X 前 / Y 右 / Z 下）。
          默认 0 = 锚点就在本地原点正下方。仿真里原点就是模型出生点，
          所以这时两边自动一致，不用再改 SDF 的 <anchor_offset>。
          一般保持 0：绳的方向由 MYR_ROPE_ANGLE 和起飞航向决定，不需要靠挪锚点来摆。
      type: float
      default: 0.0
      decimal: 2
      min: -100.0
      max: 100.0
      unit: m
    MYR_ANCHOR_Y:
      description:
        short: 系绳锚点的左右位置（机体系，右为正）
        long: |-
          地面系绳点相对 EKF 本地原点的左右偏移，单位 m，右为正。
          非 0 时 SDF 里的 <anchor_offset> 也要改（gz 那个是**世界系** ENU：
          x 东、y 北、z 上），换算起来容易出错，所以除非确实需要，保持 0。
      type: float
      default: 0.0
      decimal: 2
      min: -100.0
      max: 100.0
      unit: m
    MYR_ANCHOR_Z:
      description:
        short: 系绳锚点的高低（机体系，下为正）
        long: |-
          地面系绳点相对 EKF 本地原点的高低偏移，单位 m，**向下为正**（NED 同号，不用换）。
          锚点在地面上时填 0（默认）。锚点挂在高处（比如塔上、杆上）时填负值，
          例如锚点在原点上方 3 m 就填 -3。
      type: float
      default: 0.0
      decimal: 2
      min: -100.0
      max: 100.0
      unit: m
    MYR_ROPE_LEN:
      description:
        short: 绳长（0 = 不做系绳测试）
        long: |-
          绳子的长度，单位 m。**0 = 关闭系绳段**，任务行为和没有这个功能时
          完全一样（WAIT -> TAKEOFF -> [FORWARD] -> HOVER -> LAND）。
          大于 0 时它**接管 FORWARD 的目的地**：飞机不再飞 MYM_FWD_DIST，
          而是飞向"斜距正好等于这个绳长"的绷紧点，到位后进 TILT 低头。
          两个都配了也只听绳的 —— MYM_FWD_DIST / MYM_FWD_DIR 失效。

          ⚠ 三条选值的判据：
          1) **必须明显大于 MYM_ALT**（建议 ≥ 3 倍）。飞机在锚点正上方的斜距
             就等于 MYM_ALT，绳比它短的话爬升途中就被拽住，表现为起飞超时。
          2) 绷紧点高度 = L*sin(θ)，水平 = L*cos(θ)，这一段要在 MYM_FWD_TMO
             内飞完（10 m 绳实测约 11 s）。
          3) 必须和 gz 里 TetherPlugin 的绳长一致（GZ_TETHER_LEN 或 SDF 的
             <rope_length>，见上面这组参数的总说明）。

          参考量级（θ=30°、起飞高度 2 m）：L=10 m → 水平 8.66 m、高 5.0 m。
      type: float
      default: 0.0
      decimal: 1
      min: 0.0
      max: 200.0
      unit: m
    MYR_ROPE_ANGLE:
      description:
        short: 绷紧时绳和地面的夹角
        long: |-
          到达绷紧点时，绳与地面的夹角，单位度。绷紧点因此位于
          "距锚点水平 L*cos(θ)、高出 L*sin(θ)"的位置。
          角度大 -> 飞机悬得高、离锚点近；角度小 -> 贴地飞得远、张力的水平分量大。
          绳的竖直分量 T*sin(θ) 会把飞机往下拽，这部分由位置环补总距吸收，
          所以角度越大、同样的低头角对应的绳张力越小而竖直负载越大。
      type: float
      default: 30.0
      decimal: 1
      min: 1.0
      max: 89.0
      unit: deg
    MYR_TILT_HOLD:
      description:
        short: 绷紧点上低头保持多久
        long: |-
          到达绷紧点、开始低头之后，保持多少秒再转降落，单位 s。
          注意前馈有**固定的**斜坡（2.5 m/s^2/s，写死在代码里，不是参数）：
          15° 的低头约 1 s 爬上去、约 1 s 退回来，所以实际"完全低头"的时间
          比这个值少约 1 s，而 TILT 的总时长比它多约 1 s。
          **和 MYM_HOVER 完全独立**：MYM_HOVER 只管"没开绳时到前方点后悬停多久"，
          这里管"开了绳低头保持多久"，两边可以按需要差很远。
          0 = 一到绷紧点就开始降落（几乎看不到低头）。
          实测低头姿态大约 1 s 内建立（PITCH 从 0 到 -14°），所以想看清稳态
          至少给 5 s 以上。
      type: float
      default: 10.0
      decimal: 1
      min: 0.0
      max: 600.0
      unit: s
    MYR_FWD_THR:
      description:
        short: 低头时的前推力电机油门
        long: |-
          归一化油门（0 ~ 1，和 MYM_FWD_THR_MAX 同一口径），拉绳段低头时给推进电机多少油。

          **一给，姿态就自动钉在低头上限上**（min(|MYM_PITCH_MIN|, MPC_TILTMAX_AIR)，
          默认 15°），MYR_PITCH_DOWN 被忽略。0 = 不用推进电机，只靠姿态。

          内部换算（和位置环那套互为逆运算）：
              a = g * ( tan(上限) + 油门 / MYM_FWD_THR_SC )
          位置环再把 a 反解回需求角、夹在 15°，缺额 tan(需求)-tan(15) 乘
          MYM_FWD_THR_SC 正好等于这个油门。

          对表（上限 15°、SC 0.44、4 kg）：
              0.0 -> a =  2.63 m/s^2, 俯仰 -15°, 推进电机   0%, 前向力 10.5 N
              0.2 -> a =  7.09 m/s^2, 俯仰 -15°, 推进电机  20%, 前向力 28.7 N
              0.5 -> a = 13.80 m/s^2, 俯仰 -15°, 推进电机  50%, 前向力 55.9 N

          ⚠ 必须 **MYM_FWD_THR_EN = 1**：辅助关掉时姿态照样钉在 15°，
          但油门那部分力没人出，飞机会被绳拽回去。
          ⚠ MYM_PITCH_MIN 必须 < 0（默认 -15），设成 0 等于关闭夹紧，这里无从反解。
      type: float
      default: 0.0
      decimal: 2
      min: 0.0
      max: 1.0
      unit: norm
    MYR_PITCH_DOWN:
      description:
        short: 绷紧点上的低头角
        long: |-
          到达绷紧点后低头多少度（正 = 低头），高度不变（由位置环维持）。
          实现方式：给位置环一个沿航向的**加速度前馈** a = g*tan(φ)，而
          加速度到姿态的映射就是 倾角 = atan(a/g)，所以稳态姿态正好是 φ。
          低头之后飞机想往前冲，绳拉住它 -> 位置误差≈0 -> 姿态稳定在 φ。
          **会被夹到 MPC_TILTMAX_AIR 以内**（默认 45°），超了会告警并夹住。
          φ=20° 时绳张力约 14.6 N，φ=30° 约 23.1 N（都不含推力电机）。
          0 = 不低头：TILT 段照常保持 MYR_TILT_HOLD 秒，只是姿态保持水平。

          **MYR_FWD_THR > 0 时这个参数被忽略**：油门一给，姿态就钉在上限上。
          想"角度慢慢加"就把油门留 0，只调这个值。
          只开姿态（油门 0）时前推力辅助不会出力：需求角正好等于上限，缺额为零。
      type: float
      default: 15.0
      decimal: 1
      min: -45.0
      max: 45.0
      unit: deg
