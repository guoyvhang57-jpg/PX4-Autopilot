module_name: mc_pos_control
parameters:
- group: Multicopter Position Control
  definitions:
    MPC_XY_VEL_MAX:
      description:
        short: Maximum horizontal velocity
        long: |-
          Absolute maximum for all velocity controlled modes.
          Any higher value is truncated.
      type: float
      default: 12.0
      unit: m/s
      min: 0
      max: 20
      decimal: 1
      increment: 1
    MPC_Z_VEL_MAX_UP:
      description:
        short: Maximum ascent velocity
        long: |-
          Absolute maximum for all climb rate controlled modes.
          In manually piloted modes full stick deflection commands this velocity.

          For default autonomous velocity see MPC_Z_V_AUTO_UP
      type: float
      default: 3.0
      unit: m/s
      min: 0.5
      max: 8
      increment: 0.1
      decimal: 1
    MPC_Z_VEL_MAX_DN:
      description:
        short: Maximum descent velocity
        long: |-
          Absolute maximum for all climb rate controlled modes.
          In manually piloted modes full stick deflection commands this velocity.

          For default autonomous velocity see MPC_Z_V_AUTO_UP
      type: float
      default: 1.5
      unit: m/s
      min: 0.5
      max: 4
      increment: 0.1
      decimal: 1
    MPC_TILTMAX_AIR:
      description:
        short: Maximum tilt angle in air
        long: |-
          Absolute maximum for all velocity or acceleration controlled modes.
          Any higher value is truncated.
      type: float
      default: 45.0
      unit: deg
      min: 20
      max: 89
      decimal: 0
      increment: 1
    MPC_TILTMAX_LND:
      description:
        short: Maximum tilt during inital takeoff ramp
        long: Tighter tilt limit during takeoff to avoid tip over.
      type: float
      default: 12.0
      unit: deg
      min: 5
      max: 89
      decimal: 0
      increment: 1
    MPC_THR_MIN:
      description:
        short: Minimum collective thrust in climb rate controlled modes
        long: |-
          Too low thrust leads to loss of roll/pitch/yaw torque control authority.
          With airmode enabled this parameters can be set to 0
          while still keeping torque authority (see MC_AIRMODE).
      type: float
      default: 0.12
      unit: norm
      min: 0.05
      max: 0.5
      decimal: 2
      increment: 0.01
    MPC_THR_MAX:
      description:
        short: Maximum collective thrust in climb rate controlled modes
        long: Limit allowed thrust e.g. for indoor test of overpowered vehicle.
      type: float
      default: 1.0
      unit: norm
      min: 0
      max: 1
      decimal: 2
      increment: 0.05
    MPC_ACC_DECOUPLE:
      description:
        short: Acceleration to tilt coupling
        long: |-
          Set to decouple tilt from vertical acceleration.
          This provides smoother flight but slightly worse tracking in position and auto modes.
          Unset if accurate position tracking during dynamic maneuvers is more important than a smooth flight.
      type: boolean
      default: 1
    MYM_PITCH_MIN:
      description:
        short: 前推力辅助的低头角上限
        long: |-
          需求俯仰角低于这个值时，输出姿态被夹在这里，而"更平的姿态压不出来"的那部分
          水平力交给机头方向的推进电机（vehicle_attitude_setpoint.thrust_body[0]）。
          只在 MYM_FWD_THR_EN 打开时生效。

          负值 = 低头。0 = 关闭这个夹紧。

          它**不替代** MPC_TILTMAX_AIR：那个仍然是所有方向上的绝对倾角上限，
          这个是更严的、只管低头的上限，用来触发辅助。两者取更平的那个 ——
          按默认值（45° 对 -15°），低头方向由这个限制，其它方向由 MPC_TILTMAX_AIR 限制。
      type: float
      default: -15.0
      unit: deg
      min: -30.0
      max: 0.0
      decimal: 1
      increment: 1
    MYM_FWD_THR_EN:
      description:
        short: 前推力辅助
        long: |-
          把"被夹住的低头姿态压不出来"的那部分力交给机头方向的推进电机，
          而不是把它当成跟踪误差丢掉。要求这些推进电机已经进了控制分配
          （CA_ROTORn 的推力轴 x 分量非 0）。

          普通多旋翼保持关闭：那种机架上没有任何作动器能产生 body-x 方向的力，
          需求只会一直分配不出去。

          关闭 = 输出和不带这个功能的固件逐字节一致。
      type: enum
      values:
        0: 关闭
        1: 打开
      default: 0
    MYM_FWD_THR_SC:
      description:
        short: 缺失水平力到前推力的换算系数
        long: |-
          把缺失的水平力 [N] 换算成写进 thrust_body[0] 的归一化前推力。
          这是**几何换算，不是调参增益**：

              SC = m*g / K_F

          K_F 是一个单位的 thrust_body[0] 能产生的前向力 [N]，由分配器几何决定。

          **填 0 = 自动算（推荐）**：my_mission 会从机体的物理量推出来，通过
          my_mission_assist.fwd_thrust_sc 每拍发过来：

              SC = MPC_THR_HOVER * (4 + 2*|CA_ROTOR4_AZ|) / CA_ROTOR4_AX

          这样改 CA_ROTOR*_CT 或 MPC_THR_HOVER 时它会自动跟上，不会出现
          "三个地方各填一个数、互相矛盾"的情况（曾经出现过 CT=21.6、
          MPC_THR_HOVER=0.41、SC=0.44 三者互不一致）。

          填正数则直接用（不跑 my_mission 时也用这个值）。
      type: float
      default: 0.0
      min: 0.0
      max: 5.0
      decimal: 3
      increment: 0.01
    MYM_FWD_THR_MAX:
      description:
        short: 归一化前推力的上限
        long: |-
          辅助产生的 thrust_body[0] 的上界。要留在推进电机饱和之前：
          一旦饱和，辅助就再也补不上缺额，跟踪误差只会越来越大。
      type: float
      default: 0.5
      unit: norm
      min: 0.0
      max: 1.0
      decimal: 2
      increment: 0.05
    MYM_FWD_THR_SLEW:
      description:
        short: 前推力的上升斜率
        long: |-
          辅助输出（thrust_body[0]）往目标值爬升的速率，单位是"归一化推力/秒"。
          目的是别让推进电机一步到位：实测推力桨从 0 跳到 50% 油门那一拍，
          航向漂了 32°，加速度振动指标从 5 涨到 12~14。

          **只限制上升**。辅助关闭（MYM_FWD_THR_EN = 0、离开 Offboard、
          任务不再许可）或者需求消失时，输出立刻归零，不走斜坡 ——
          否则"关掉辅助"之后电机还会按斜坡推好几秒。

          爬到位要多久 = 目标推力 / 斜率：

              目标推力 0.20（MYR_FWD_THR 0.45，拉绳）：
                  0.067 -> 3 s
                  0.050 -> 4 s      ← 默认
                  0.040 -> 5 s
              目标推力 0.50（MYM_FWD_THR_MAX）：
                  0.050 -> 10 s

          注意这里算的是**推力**，不是油门。油门的曲线是推力的平方根，
          所以同样这段时间里油门前面爬得更快：0.05 推力时油门已经 22%，
          推到 0.20 推力才 45%。

          0 = 不限制（输出和不带这个参数的固件逐字节一致）。
      type: float
      default: 0.05
      unit: normalized_thrust/s
      min: 0.0
      max: 5.0
      decimal: 3
      increment: 0.005
